#DEV
---
spring:
  config:
    activate:
      on-profile: dev
  cloud:
    nacos:
      discovery:
        # 服务注册地址
        server-addr: 172.16.41.13:8848
        namespace: measure-dev
      config:
        # 配置中心地址
        server-addr: 172.16.41.13:8848
        namespace: measure-dev
        # 配置文件格式
        file-extension: yml
        # 共享配置
        shared-configs:
          - application-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
